name: Build tweak

# CI build: compiles the tweak against an on-demand-fetched iOS 6.1 SDK
# (see .github/actions/setup-theos) and uploads the resulting .deb as a
# build artifact on every push/PR. For tagged releases, see release.yml.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-theos

      - name: Build package
        run: make package FINALPACKAGE=1

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: WallpaperParallax-deb
          path: debs/packages/*.deb
          if-no-files-found: error
